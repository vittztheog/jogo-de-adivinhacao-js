<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
    <body>
        <main>
            <div class="container">
                <header class="header">
                    <h1>Jogo de Adivinhação</h1>
                    <h2>REGRAS:</h2>
                    <ul>
                        <li>O jogo escolhe um número secreto entre 1 e 100 e seu objetivo é adivinhá-lo.</li>
                        <li>A cada tentativa, você receberá uma dica dizendo se o número é maior ou menor.</li>
                        <li>O jogo termina quando você acertar ou esgotar suas tentativas.</li>
                    </ul>
                </header>
                <div class="inputs">
                    <label for="palpite">Seu palpite:</label>
                    <input id="palpite" type="number">
                </div>
                <div class="buttons">
                    <button id="btn-chute">Chutar</button>
                    <button id="btn-reiniciar">Reiniciar</button>
                </div>
                <div class="mensagens">
                    <p id="dicas"></p>
                    <p id="resultado"></p>
                    <p id="tentativas"></p>
                </div>
            </div>
        </main>

        <script src="scripts/script.js"></script>
    </body>
</html>
